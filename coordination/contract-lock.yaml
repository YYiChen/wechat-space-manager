policy:
  scope: contracts/** and every public serialized payload crossing module boundaries
  acquisition: Owner marks a lock active before editing and names consumers, compatibility strategy, and expiry.
  release: Integration verification recorded in fact-log and integration-board; owner then clears active.
  stale_lock: Locks expire after one working day and must be renewed or released by orchestrator.
  emergency: No emergency contract change is permitted for R3/R4 behavior; create a new compatible version instead.
